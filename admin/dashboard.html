<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPDC Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Ensure FA is loaded -->
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-card: #141414;
            --color-text: #ffffff;
            --color-text-muted: #888888;
            --color-neon: #a0d6b4;
            /* Reduced intensity neon green */
            --color-accent: #C4613A;
            /* Copper/Orange */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            font-size: 2rem;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--color-neon);
            color: var(--color-neon);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: var(--color-neon);
            color: #000;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: var(--color-card);
            padding: 20px;
            border-left: 4px solid var(--color-neon);
            border-radius: 4px;
        }

        .kpi-label {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-family: 'Anton', sans-serif;
            color: var(--color-text);
        }

        /* Tables */
        .section-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--color-text);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--color-card);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .data-table th,
        .data-table td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #222;
        }

        .data-table th {
            background-color: #1a1a1a;
            color: var(--color-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .data-table tr:hover {
            background-color: #1f1f1f;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-captured {
            background: rgba(160, 214, 180, 0.2);
            color: var(--color-neon);
        }

        .badge-student {
            background: rgba(196, 97, 58, 0.2);
            color: var(--color-accent);
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>MPDC Command Center</h1>
        <button class="refresh-btn" onclick="fetchData()">REFRESH DATA</button>
    </div>

    <!-- Metrics -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">Total Leads (Abandonments)</div>
            <div class="kpi-value" id="count-leads">-</div>
        </div>
        <div class="kpi-card" style="border-color: var(--color-accent);">
            <div class="kpi-label">Active Students</div>
            <div class="kpi-value" id="count-students">-</div>
        </div>
        <div class="kpi-card" style="border-color: #fff;">
            <div class="kpi-label">Est. Revenue (Lifetime)</div>
            <div class="kpi-value" id="revenue-est">-</div>
        </div>
    </div>

    <!-- Leads Table -->
    <div>
        <div class="section-title">🛑 Recent Cart Abandonments (Leads)</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="leads-body">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>

    <!-- Students Table -->
    <div>
        <div class="section-title">✅ Recent Enrolled Students</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Joined Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Access Level</th>
                </tr>
            </thead>
            <tbody id="students-body">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>

    <!-- Authentication Gate (Simple) -->
    <script>
        // SUPABASE CONFIG (PUBLIC CLIENT)
        const SUPABASE_URL = 'https://vobbqsipyyftscyvxuja.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvYmJxc2lweXlmdHNjeXZ4dWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMjQyNDgsImV4cCI6MjA4NTcwMDI0OH0.aSxwAUb-qWZBVPQJ-s5FiGIKtu8dBlHGnuV5i0H2QHc';

        // FIX: Use a different name than the library itself
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Simple Passcode Gate to prevent random internet access
        // (Note: This is not bank-grade security, but sufficient for hiding a page)
        function checkAuth() {
            if (localStorage.getItem('mpdc_admin_auth') !== 'true') {
                const pass = prompt("Enter Admin Password:");
                if (pass === 'mpdc2026') { // Hardcoded convenient password
                    localStorage.setItem('mpdc_admin_auth', 'true');
                } else {
                    alert("Access Denied");
                    document.body.innerHTML = '<h1 style="text-align:center; margin-top:50px;">ACCESS DENIED</h1>';
                    return false;
                }
            }
            return true;
        }

        async function fetchData() {
            if (!checkAuth()) return;

            // 1. Fetch Leads
            const { data: leads, error: leadError } = await sbClient
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            // 2. Fetch Students
            const { data: profiles, error: profileError } = await sbClient
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            // 3. Update Counts (Ideally we use count() query but this is quick)
            const { count: leadCount } = await sbClient.from('leads').select('*', { count: 'exact', head: true });
            const { count: studentCount } = await sbClient.from('profiles').select('*', { count: 'exact', head: true });

            // RENDER UI

            // KPI
            document.getElementById('count-leads').innerText = leadCount || 0;
            document.getElementById('count-students').innerText = studentCount || 0;
            document.getElementById('revenue-est').innerText = '$' + ((studentCount || 0) * 97).toLocaleString();

            // Leads Table
            const leadsBody = document.getElementById('leads-body');
            leadsBody.innerHTML = '';
            if (leads) {
                leads.forEach(lead => {
                    const date = new Date(lead.created_at).toLocaleDateString();
                    const row = `
                        <tr>
                            <td>${date}</td>
                            <td style="font-weight:bold;">${lead.name || 'Unknown'}</td>
                            <td>${lead.email}</td>
                            <td><span class="status-badge badge-captured">Abandoned</span></td>
                        </tr>
                    `;
                    leadsBody.insertAdjacentHTML('beforeend', row);
                });
            }

            // Students Table
            const studentsBody = document.getElementById('students-body');
            studentsBody.innerHTML = '';
            if (profiles) {
                profiles.forEach(student => {
                    const date = new Date(student.created_at).toLocaleDateString();
                    const row = `
                        <tr>
                            <td>${date}</td>
                            <td style="font-weight:bold;">${student.name || 'Unknown'}</td>
                            <td>${student.email}</td>
                            <td><span class="status-badge badge-student">Active</span></td>
                        </tr>
                    `;
                    studentsBody.insertAdjacentHTML('beforeend', row);
                });
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchData);

    </script>
</body>

</html>
